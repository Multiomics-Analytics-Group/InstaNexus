name: Python application

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          pip install ruff
      - name: Check formatting with ruff
        run: |
          ruff format --check .
      - name: Lint with ruff
        run: |
          ruff check .
