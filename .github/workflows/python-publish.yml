# Publish instanexus to PyPI when a GitHub release is created.
#
# HOW IT WORKS
# 1. A maintainer creates a new GitHub Release (via the web UI or gh CLI).
# 2. This workflow triggers on the "release published" event.
# 3. It checks that the release tag matches the version in pyproject.toml,
#    builds an sdist + wheel with `python -m build`,
#    and uploads both to PyPI via trusted publishing (OIDC, no API token).
#
# HOW TO TRIGGER
# Option A — GitHub web UI:
#   1. Go to https://github.com/Multiomics-Analytics-Group/InstaNexus/releases/new
#   2. Create a new tag vX.Y.Z matching the version in pyproject.toml (e.g. v0.3.1)
#   3. Fill in release title and notes, then click "Publish release"
#   4. The workflow starts automatically.
#
# Option B — GitHub CLI:
#   gh release create v0.3.1 --title "InstaNexus v0.3.1" --notes "Release notes here"
#
# To retry a failed publish, use "Re-run jobs" on the release's workflow run.
#
# PREREQUISITES
# - This repository and workflow file (python-publish.yml, no environment) must be
#   registered as a trusted publisher for the instanexus project on PyPI:
#   https://pypi.org/manage/project/instanexus/settings/publishing/
#   The job needs `id-token: write` to request the OIDC token.
#
# - The version in pyproject.toml must match the release tag (without the "v" prefix).
#   For example, tag "v0.3.1" should correspond to version = "0.3.1" in pyproject.toml.
#   The workflow fails before building if they differ.
#   PyPI will reject uploads if the version already exists.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Check release tag matches pyproject.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match version '$VERSION' in pyproject.toml"
            exit 1
          fi
          echo "Tag $TAG matches pyproject.toml version $VERSION"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
